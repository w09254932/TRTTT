services:
  - type: web
    name: trttt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: EDFAPAY_ENV
        value: sandbox
      - key: OWNER_NUMBER
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: EDFAPAY_MERCHANT_ID
        sync: false
      - key: EDFAPAY_MERCHANT_PASSWORD
        sync: false
      - key: EDFAPAY_API_KEY
        sync: false
      - key: EDFAPAY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        sync: false
