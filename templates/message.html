{% extends "base.html" %}
{% block body %}
<main class="gate">
  <h1>{{ title }}</h1>
  {% if problems %}

  <ul class="vars">{% for name, hint in problems %}<li><code dir="ltr">{{ name }}</code>{{ hint }}</li>{% endfor %}</ul>
  {% endif %}
</main>
{% endblock %}
