{% extends "base.html" %}
{% block body %}
<header class="bar">
  <a class="brand" href="{{ url_for('admin.dashboard') }}"><span class="name">{{ store_name }}</span></a>
  <form method="post" action="{{ url_for('admin.logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="plain" type="submit">تسجيل الخروج</button>
  </form>
</header>
<nav class="tabs" aria-label="أقسام اللوحة">
  <a class="{{ 'on' if request.blueprint == 'admin' }}" href="{{ url_for('admin.dashboard') }}">الفواتير</a>
  <a class="{{ 'on' if request.blueprint == 'shop_admin' }}" href="{{ url_for('shop_admin.products') }}">المتجر</a>
  <a class="{{ 'on' if request.blueprint == 'book' }}" href="{{ url_for('book.people') }}">العملاء</a>
  <a class="{{ 'on' if request.blueprint == 'messages' }}" href="{{ url_for('messages.compose') }}">الرسائل</a>
  <a class="{{ 'on' if request.blueprint == 'brand' }}" href="{{ url_for('brand.settings') }}">الإعدادات</a>
</nav>
<main class="wrap">
  {% for kind, message in get_flashed_messages(with_categories=true) %}<p class="{{ 'alert' if kind == 'error' else 'note' }}" role="status">{{ message }}</p>{% endfor %}
  {% block main %}{% endblock %}
</main>
{% endblock %}
