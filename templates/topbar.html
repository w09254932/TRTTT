{#- The customers' top bar: the store on one side, the account on the other (an icon until the customer signs in). -#}
{% set me = customer_account() %}
<header class="topbar">
  <a class="home" href="{{ url_for('shop.store') }}">{% if brand and brand.logo %}<img src="{{ url_for('brand.logo', v=brand.version) }}" alt="">{% endif %}<span>{{ store_name }}</span></a>
  {% if me %}
  <a class="who in" href="{{ url_for('account.orders') }}">حسابي<span class="face" aria-hidden="true">{{ me.email[:1]|upper }}</span></a>
  {% else %}
  <a class="who" href="{{ url_for('account.login', next=request.path if request.path != '/' else None) }}">تسجيل الدخول<span class="face" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></span></a>
  {% endif %}
</header>
